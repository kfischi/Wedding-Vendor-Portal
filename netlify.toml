[build]
  base    = "wedding-portal"
  command = "pnpm install --frozen-lockfile && npx tsc --noEmit && pnpm build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION            = "20"
  NEXT_TELEMETRY_DISABLED = "1"

# ─── Required secrets — set these in Netlify UI (never commit values here) ───
# Site configuration → Environment variables → Add variable
#
#   DIRECT_URL                    = postgresql://postgres:***@db.ulfwxmjerugxayuyliug.supabase.co:5432/postgres
#   DATABASE_URL                  = postgresql://postgres.ulfwxmjerugxayuyliug:***@aws-0-*.pooler.supabase.com:6543/postgres
#   NEXT_PUBLIC_SUPABASE_URL      = https://ulfwxmjerugxayuyliug.supabase.co
#   NEXT_PUBLIC_SUPABASE_ANON_KEY = eyJ...
#   SUPABASE_SERVICE_ROLE_KEY     = eyJ...
#   ADMIN_EMAIL                   = kfir.biz@gmail.com
#   RESEND_API_KEY                = re_...
#   PING_SECRET                   = (random string for /api/ping)
#   NEXT_PUBLIC_APP_URL           = https://www.weddingpro.co.il

# ─── Headers ──────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
