name: Auto Blog Generator

on:
  schedule:
    - cron: "0 7 */4 * *"  # כל 4 ימים בשעה 07:00 UTC
  workflow_dispatch:         # הפעלה ידנית מ-GitHub

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate blog post
        run: |
          response=$(curl -s -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.N8N_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${{ secrets.APP_URL }}/api/admin/blog-generate")

          echo "HTTP Status: $response"
          cat response.json

          if [ "$response" != "200" ] && [ "$response" != "201" ]; then
            echo "❌ Blog generation failed with status $response"
            exit 1
          fi

          echo "✅ Blog post created: $(cat response.json | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"slug\", \"unknown\"))')"
